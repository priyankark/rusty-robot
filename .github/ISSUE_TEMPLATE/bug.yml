name: Bug report
description: Report a reproducible defect
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS/version, Rusty Robot version, display scale and arrangement, Rust version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include expected and observed behavior; omit private screenshots and credentials.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Test output or logs
