name: Rust contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: node scripts/build-node.cjs
      - run: node --test crates/rusty-robot-node/tests/media.cjs
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked --no-fail-fast
      - run: cargo test --no-default-features --locked --no-fail-fast
      - run: cargo doc --workspace --all-features --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.88.0'
      - run: cargo check --workspace --lib --all-features --locked
      - run: cargo check --lib --no-default-features --locked
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: rusty-robot
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: octalmage/robotjs
          ref: 0af6073e1f1bcff865ffe52801c71647829cdc1c
          path: robotjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - run: node rusty-robot/scripts/audit-rust-port.mjs robotjs
      - run: node --test tests/gui/verification/protocol.test.cjs
        working-directory: rusty-robot
      - run: python3 scripts/check-benchmarks.py
        working-directory: rusty-robot
      - run: python3 scripts/benchmark-report.py --check
        working-directory: rusty-robot
      - run: python3 scripts/consumer-report.py --check
        working-directory: rusty-robot
      - run: cargo package --locked
        working-directory: rusty-robot
  pages-build:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, msrv, evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - run: cargo doc --workspace --all-features --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: python3 scripts/build-site.py
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: target/site
  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
