name: Published Cargo consumer
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published crates.io version to verify
        default: '0.1.2'
        required: true
  pull_request:
    paths: ['scripts/test-registry.py', '.github/workflows/registry-smoke.yml']
permissions:
  contents: read
jobs:
  consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.x'
      - name: Exercise the registry dependency from a fresh application
        shell: bash
        env:
          CRATE_VERSION: ${{ inputs.version || '0.1.2' }}
        run: python scripts/test-registry.py --version "$CRATE_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: registry-consumer-${{ matrix.os }}
          path: |
            target/registry-dogfood/report.json
            target/registry-dogfood/*.log
          if-no-files-found: error
