<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rusty Robot Workflow · Owned test app</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f4f0;color:#222d35;font:17px/1.45 system-ui,sans-serif}header{background:#222d35;color:white;padding:20px 28px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;letter-spacing:-.5px}.engine{font-size:14px;color:#d0d6db}main{padding:22px 28px}h1{font-size:29px;letter-spacing:-1px;margin:0 0 6px}.subtitle{color:#67747b;margin:0 0 20px}.stats{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d4d5ce;padding-bottom:14px;margin-bottom:20px}.clock{font-size:34px;font-weight:750;font-variant-numeric:tabular-nums}.badge{background:#e8e5dd;padding:7px 13px;border-radius:6px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}.panel{background:white;border:1px solid #d8d9d1;border-radius:12px;padding:22px}h2{font-size:18px;margin:0 0 16px}label{display:block;color:#56636c;font-size:14px;margin-bottom:14px}input,textarea{display:block;width:100%;border:1px solid #bac3c8;border-radius:6px;padding:10px;font:17px system-ui;color:#222d35;margin-top:5px}textarea{height:100px;resize:none}button{font:650 16px system-ui;background:#b64b24;color:white;padding:12px 18px;border:0;border-radius:6px;cursor:pointer}input:focus,textarea:focus,button:focus-visible{outline:3px solid #e9ae78;outline-offset:2px}.saved{padding:10px 0;border-bottom:1px solid #e8e8e3;font-size:15px}.saved small{display:block;color:#64747d}.saved strong{color:#33704d}.taskboard{height:410px;position:relative;background:#fff;border:1px solid #d8d9d1;border-radius:12px;overflow:hidden}.task{position:absolute;background:#f2f3f5;color:#63717b;border:1px solid #d2d6d9;border-radius:8px;width:170px;height:70px;padding:12px;font-size:15px}.task b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:1px}.task.target{background:#00ff00;color:#163923;border:0;border-radius:0;font-weight:800}.task.done{background:#e3efe6;color:#346345}#log{margin-top:16px;font-size:15px;color:#586b76}.foot{font-size:13px;color:#697780;margin:18px 0 0}.complete{color:#286940;font-weight:750}#cursor{position:fixed;z-index:20;pointer-events:none;width:20px;height:20px;border:3px solid #b84d22;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 3px #ffffffa0;display:none}
</style><header><div class="brand">DESKTOP WORKFLOW</div><div class="engine" id="engine"></div></header><main><h1 id="title"></h1><p class="subtitle" id="subtitle"></p><div class="stats"><span class="badge" id="status">Ready</span><span class="clock" id="clock">0.000 s</span></div><div id="content"></div><p class="foot">Native keyboard + mouse input. Screenshot-based clicks in the task board. Test data only.</p></main><div id="cursor"></div><script>
const data=[['Avery Chen','avery.chen@example.test','Send the revised onboarding pack and confirm the Friday review.'],['Morgan Patel','morgan.patel@example.test','Prepare a demo workspace with the import and export examples.'],['Jordan Silva','jordan.silva@example.test','Follow up on the accessibility feedback from the design review.'],['Casey Brooks','casey.brooks@example.test','Share the monthly report with the operations contact next week.'],['Riley Khan','riley.khan@example.test','Schedule a product walkthrough after the new account is ready.'],['Taylor Reed','taylor.reed@example.test','Confirm the trial requirements and send the setup instructions.'],['Sam Rivera','sam.rivera@example.test','Collect the migration checklist before the next planning call.'],['Alex Kim','alex.kim@example.test','Arrange a feedback session with the customer support team.']];
window.workflow={saved:[],hits:0,misses:0,errors:[],trusted:0,started:0,finished:0,mode:'',target:0};
const w=window.workflow;const positions=[[25,24],[225,24],[425,24],[625,24],[25,125],[225,125],[425,125],[625,125],[25,226],[225,226],[425,226],[625,226]];
window.reset=(mode,engine)=>{Object.assign(w,{saved:[],hits:0,misses:0,errors:[],trusted:0,started:0,finished:0,mode,target:0,failure:null});document.querySelector('#engine').textContent=engine;document.querySelector('#clock').textContent='0.000 s';document.querySelector('#status').textContent='Ready';document.querySelector('#status').className='badge';document.querySelector('#status').style.color="";document.querySelector('#title').textContent=mode==='form'?'Create eight customer records':'Find and complete 48 moving tasks';document.querySelector('#subtitle').textContent=mode==='form'?'Type the name, email, and follow-up note. Save each record.':'Capture the board, locate the green task in the pixels, and click it.';
if(mode==='form'){document.querySelector('#content').innerHTML='<div class="cols"><form class="panel"><h2>New customer</h2><label>Full name<input id="name" autocomplete="off"></label><label>Email<input id="email" autocomplete="off"></label><label>Follow-up note<textarea id="note"></textarea></label><button id="save">Save customer</button></form><section class="panel"><h2>Saved customers</h2><div id="saved">No records yet</div></section></div>';document.querySelector('form').onsubmit=e=>{e.preventDefault();const row=['name','email','note'].map(id=>document.getElementById(id).value);if(JSON.stringify(row)!==JSON.stringify(data[w.saved.length])){w.errors.push(row);document.querySelector('#status').textContent='Incorrect input';return}w.saved.push(row);document.querySelector('#saved').innerHTML=w.saved.map(r=>'<div class="saved"><strong>✓ '+r[0]+'</strong><small>'+r[1]+'</small></div>').join('');e.target.reset();document.querySelector('#name').focus();document.querySelector('#status').textContent=w.saved.length+' / 8 records saved';if(w.saved.length===8)finish('8 / 8 records verified')};}
else{document.querySelector('#content').innerHTML='<div class="taskboard" id="board"></div><div id="log">Waiting for the first screenshot and native click.</div>';draw();document.querySelector('#board').addEventListener('click',e=>{if(!e.isTrusted){w.errors.push('untrusted click');return}if(!e.target.closest('.target')){w.misses++;return}w.hits++;document.querySelector('#status').textContent=w.hits+' / 48 tasks completed';document.querySelector('#log').textContent='✓ Task '+w.hits+' received a real mouse click · '+w.misses+' missed clicks';if(w.hits===48){finish('48 / 48 tasks · zero misses');document.querySelector('#board').innerHTML='<div style="padding:90px 30px;text-align:center;font-size:35px;color:#286940">✓ All tasks completed</div>';return}draw()});}
};
function draw(){const active=(w.hits*7+3)%12;document.querySelector('#board').innerHTML=positions.map(([x,y],i)=>'<div class="task '+(i===active?'target':'')+'" style="left:'+x+'px;top:'+y+'px"><b>'+ (i===active?'READY':'QUEUED')+'</b>Task '+(w.hits+1+i)+'</div>').join('')}
function finish(text){w.finished=performance.now();document.querySelector('#status').textContent='PASS · '+text;document.querySelector('#status').className='badge complete';document.querySelector('#clock').textContent=((w.finished-w.started)/1000).toFixed(3)+' s'}
window.fail=(message,label="CAPTURE FAILED")=>{w.failure=message;w.finished=performance.now();document.querySelector("#status").textContent=label;document.querySelector("#status").style.color="#a32619";document.querySelector("#log").textContent=message;document.querySelector("#clock").textContent=((w.finished-w.started)/1000).toFixed(3)+" s";};
window.start=()=>{w.started=performance.now()};window.state=()=>({saved:w.saved,hits:w.hits,misses:w.misses,errors:w.errors,trusted:w.trusted,active:document.hasFocus(),finished:!!w.finished,failure:w.failure||null,seconds:(w.finished-w.started)/1000});
for(const ev of ['keydown','click','input'])document.addEventListener(ev,e=>{if(e.isTrusted)w.trusted++});
document.addEventListener('mousemove',e=>{const c=document.querySelector('#cursor');c.style.display='block';c.style.left=e.clientX+'px';c.style.top=e.clientY+'px'});
function tick(){if(w.started&&!w.finished)document.querySelector('#clock').textContent=((performance.now()-w.started)/1000).toFixed(3)+' s';requestAnimationFrame(tick)}tick();
window.records=data;window.reset('form','Ready');
</script></html>
