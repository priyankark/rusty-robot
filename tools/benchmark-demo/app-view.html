<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #fbf9f5;
      color: #26313a;
      font: 18px system-ui;
      padding: 24px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      color: #63717d;
    }
    h1 {
      font-size: 28px;
      letter-spacing: -1px;
      margin: 20px 0 8px;
    }
    p {
      margin: 0 0 16px;
      color: #65747e;
    }
    .stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    #clock {
      font-size: 42px;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
    }
    #status {
      font-weight: 650;
    }
    .frame {
      position: relative;
      width: 100%;
      aspect-ratio: 3/2;
      border: 1px solid #cbd2d7;
      background: #eef1f4;
    }
    img,
    canvas {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
    }
    canvas {
      pointer-events: none;
    }
    .progress {
      height: 12px;
      background: #e4ded5;
      margin: 18px 0 12px;
      border-radius: 8px;
      overflow: hidden;
    }
    #bar {
      background: #ad4922;
      height: 100%;
      width: 0;
    }
    .foot {
      font-size: 14px;
      color: #697780;
    }
    #result {
      font-weight: 750;
      color: #28683f;
      margin-bottom: 16px;
    }
  </style>
  <header>
    <strong id="engine"></strong><span>Live API run · 1× playback</span>
  </header>
  <h1 id="title">Analyze screenshots</h1>
  <p id="task"></p>
  <div class="stats">
    <span id="status">Ready</span><span id="clock">0.000 s</span>
  </div>
  <div class="frame">
    <img
      id="frame"
      src="/frame/0.png"
      alt="Captured application window"
    /><canvas width="1200" height="800"></canvas>
  </div>
  <div class="progress"><div id="bar"></div></div>
  <div id="result">Waiting for the start signal</div>
  <div class="foot">
    Analysis of Rust-captured app images. Capture/loading excluded. All regions
    checked against app layout.
  </div>
  <script>
    let start = 0,
      finished = false,
      count = 0,
      latest = 0,
      mode = "vscode";
    window.done = false;
    const img = document.querySelector("img"),
      ctx = document.querySelector("canvas").getContext("2d");
    fetch("/config")
      .then((r) => r.json())
      .then((c) => {
        mode = c.workload;
        document.querySelector("#title").textContent =
          mode === "vscode"
            ? "Locate search results in VS Code"
            : "Locate added blocks in a GitHub diff";
        document.querySelector("#task").textContent =
          "60 real app captures · find colored regions · check every rectangle";
        document.querySelector("#engine").textContent =
          c.language === "rust"
            ? "Rusty Robot · Rust"
            : "RobotJS · Node + C/C++";
      });
    new EventSource("/events").onmessage = (e) => {
      const x = JSON.parse(e.data);
      if (x.type === "start") {
        start = performance.now();
        return;
      }
      if (x.type === "progress") {
        count += x.result.length;
        document.querySelector("#status").textContent =
          x.index + 1 + " / 60 screenshots";
        document.querySelector("#bar").style.width =
          ((x.index + 1) / 60) * 100 + "%";
        document.querySelector("#result").textContent =
          count + " regions located";
        latest = x.index;
        const n = x.index;
        const next = new Image();
        next.onload = () => {
          if (latest !== n) return;
          img.src = next.src;
          ctx.clearRect(0, 0, 1200, 800);
          ctx.strokeStyle = "#ff7518";
          ctx.lineWidth = 3;
          for (const b of x.result) ctx.strokeRect(...b);
        };
        next.src = "/frame/" + x.index + ".png";
      }
      if (x.type === "complete") {
        finished = true;
        document.querySelector("#clock").textContent =
          x.seconds.toFixed(3) + " s";
        document.querySelector("#result").textContent =
          "PASS · " + x.targets + " regions · all 60 outputs verified";
        window.done = true;
      }
    };
    function tick() {
      if (start && !finished)
        document.querySelector("#clock").textContent =
          ((performance.now() - start) / 1000).toFixed(3) + " s";
      requestAnimationFrame(tick);
    }
    tick();
  </script>
</html>
