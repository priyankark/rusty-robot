<!doctype html><html lang="en"><meta charset="utf-8"><title>Screenshot analysis fixtures</title><style>*{box-sizing:border-box}body{margin:0;width:1920px;height:1080px;background:#eef1f4;color:#23303d;font:18px system-ui}header{height:100px;background:#1e2c3a;color:white;display:flex;justify-content:space-between;align-items:center;padding:0 32px}h1{font-size:30px;margin:0}header span{color:#c4cfd8}.toolbar{height:92px;padding:24px 32px;display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(8,218px);grid-template-rows:repeat(5,152px);gap:18px 16px;padding:0 32px}.card{background:white;border:1px solid #d4dde3;border-radius:7px;padding:15px;position:relative}.id{font-size:14px;color:#6b7e8e}.name{font-size:22px;font-weight:700;margin-top:5px}.status{position:absolute;left:16px;bottom:16px;width:100px;height:28px;background:#d9e0e6;color:#34495c;font-size:13px;font-weight:700;text-align:center;line-height:28px}.failed{background:#d14343;color:white}canvas{display:block;margin:0 auto;background:white}footer{padding:16px 32px;color:#6a7c88;font-size:15px}</style><header><h1 id="title"></h1><span id="batch"></span></header><div class="toolbar"><span id="instruction"></span><strong id="legend"></strong></div><main></main><footer>Generated fixture · no production workload or private data</footer><script>
const q=new URLSearchParams(location.search),page=Number(q.get('page')||0),mode=q.get('case');document.querySelector('#batch').textContent='Snapshot '+(page+1)+' / 60';
if(mode==='alerts'){document.querySelector('#title').textContent='Deployment monitor';document.querySelector('#instruction').textContent='Check this screenshot for a failed deployment.';document.querySelector('#legend').textContent='40 services · scan until the first failed badge';document.querySelector('main').className='grid';for(let i=0;i<40;i++){const failed=page%5===0&&i===(page*13)%40,card=document.createElement('div');card.className='card';card.innerHTML='<div class="id">SERVICE '+(100+page*40+i)+'</div><div class="name">'+['API','Worker','Gateway','Search','Billing'][i%5]+' '+(i+1)+'</div><div class="status '+(failed?'failed':'')+'">'+(failed?'Failed':'Healthy')+'</div>';document.querySelector('main').append(card)}window.expected=()=>[...document.querySelectorAll('.failed')].slice(0,1).map(e=>{const r=e.getBoundingClientRect();return [r.x,r.y,r.width,r.height]});}
else if(mode==='heatmap'){document.querySelector('#title').textContent='Test fleet health';document.querySelector('#instruction').textContent='Count the passing checks from the green tiles.';document.querySelector('#legend').textContent='10,800 checks · each tile is one test';const canvas=document.createElement('canvas');canvas.width=1800;canvas.height=810;document.querySelector('main').append(canvas);const ctx=canvas.getContext('2d');let passed=0;for(let i=0;i<10800;i++){const good=((i*37+page*17)%100)<(75+page%20);if(good)passed++;ctx.fillStyle=good?'#2eac68':'#c95757';ctx.fillRect((i%120)*15,Math.floor(i/120)*9,10,7)}window.expected=()=>passed;}
</script></html>
