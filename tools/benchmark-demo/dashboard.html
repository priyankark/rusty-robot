<!doctype html><html lang="en"><meta charset="utf-8"><title>Order review dashboard fixture</title><style>*{box-sizing:border-box}body{margin:0;width:1920px;height:1080px;background:#eef1f4;color:#23303d;font:18px system-ui}header{height:100px;background:#1e2c3a;color:white;display:flex;justify-content:space-between;align-items:center;padding:0 32px}h1{font-size:30px;margin:0}header span{color:#c4cfd8}.toolbar{height:92px;padding:24px 32px;display:flex;justify-content:space-between;align-items:center}.toolbar b{background:white;border:1px solid #d6dde2;padding:10px 20px;border-radius:6px}.grid{display:grid;grid-template-columns:repeat(8,218px);grid-template-rows:repeat(5,152px);gap:18px 16px;padding:0 32px}.card{background:white;border:1px solid #d4dde3;border-radius:7px;padding:15px;position:relative}.id{font-size:14px;color:#6b7e8e}.amount{font-size:25px;font-weight:700;margin-top:5px}.status{position:absolute;left:16px;bottom:16px;width:100px;height:28px;background:#d9e0e6;color:#34495c;font-size:13px;font-weight:700;text-align:center;line-height:28px}.ready{background:#2eac68;color:white}.tag{position:absolute;right:12px;bottom:20px;font-size:12px;color:#7d8b97}footer{padding:16px 32px;color:#6a7c88;font-size:15px}</style><header><h1>Order review</h1><span id="batch"></span></header><div class="toolbar"><span>Find every order marked <strong>Ready</strong> for approval.</span><b>All regions · 40 orders per page</b></div><div class="grid"></div><footer>Generated test dashboard · no real customer data</footer><script>const page=Number(new URLSearchParams(location.search).get('page')||0);document.querySelector('#batch').textContent='Review batch '+(page+1)+' / 60';for(let i=0;i<40;i++){const ready=((i*7+page*3)%11)<7;const card=document.createElement('div');card.className='card';card.innerHTML='<div class="id">ORDER #'+(10000+page*40+i)+'</div><div class="amount">$'+(120+(i*239+page*47)%9800).toLocaleString()+'</div><div class="status '+(ready?'ready':'')+'">'+(ready?'Ready':'On hold')+'</div><span class="tag">'+['US','EU','APAC'][(i+page)%3]+'</span>';document.querySelector('.grid').append(card)}window.expected=()=>[...document.querySelectorAll('.ready')].map(e=>{const r=e.getBoundingClientRect();return [r.x,r.y,r.width,r.height]});</script></html>
