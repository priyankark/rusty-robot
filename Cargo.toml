[package]
name = "rusty-robot"
version = "0.1.1"
edition = "2024"
description = "Cross-platform desktop automation in Rust; test-first port of RobotJS"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/priyankark/rusty-robot"
homepage = "https://priyankark.github.io/rusty-robot/"
documentation = "https://priyankark.github.io/rusty-robot/api/rusty_robot/"
readme = "README.md"
keywords = ["automation", "desktop", "robotjs", "screen", "input"]
categories = ["api-bindings", "multimedia::images"]
include = ["/src/**", "/docs/type-contracts.md", "/skills/rusty-robot/references/rust-api.md", "/examples/*.rs", "/tests/**/*.rs", "/tests/gui/*.swift", "/tests/gui/*.json", "/tests/gui/verification/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE.md", "/NOTICE.md", "/CHANGELOG.md"]

[features]
default = ["png"]
png = ["dep:png"]

[dependencies]
png = { version = "0.18", optional = true }

[dev-dependencies]
libc = "0.2"
crc32fast = "1"
flate2 = "1"
serde_json = "1"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.14", features = ["xtest", "randr"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-screen-capture-kit = "0.3"

[workspace]
members = [".", "crates/rusty-robot-media", "crates/rusty-robot-node"]
default-members = ["."]
resolver = "3"
